<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    O CÓDIGO TIKTOK SHOP — ícone da aba
    ------------------------------------------------------------------------
    Mesma marca de src/components/layout/LogoMark.tsx, mas NÃO é o mesmo
    arquivo, e isso é de propósito.

    Dentro do app a marca é traço solto sobre o fundo da plataforma. Aqui ela
    precisa ser um LADRILHO: a aba do navegador pode ser clara ou escura, e
    contorno fino sem fundo some. Nesta escala, um traço de 3.6 num viewBox de
    64 vira 0,9px — some mesmo quando carrega.

    O que muda em relação ao componente:
      · fundo escuro próprio, como na arte original;
      · traço mais grosso (4.6), para sobreviver a 16px;
      · desenho ampliado, ocupando mais do quadro.

    Cores em hexadecimal: favicon não enxerga as variáveis de tokens.css.
      ciano   #25f4ee     magenta #fe2c55     fundo #0a1416
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#25f4ee" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#25f4ee" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ladrilho: o que garante contraste em aba clara e em aba escura -->
  <rect width="64" height="64" rx="13" fill="#0a1416" />
  <rect width="64" height="64" rx="13" fill="url(#glow)" />

  <g
    fill="none"
    stroke-width="4.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(32 33) scale(1.12) translate(-32 -33)"
  >
    <g stroke="#fe2c55" transform="translate(-2.4 -1.8)">
      <path d="M25.5 27.5V20.5a6.25 6.25 0 0 1 12.5 0v7" />
      <path d="M38 20.5V9.5c0 4.6 3.4 7.8 8 8.4" />
      <rect x="11" y="26" width="42" height="30" rx="5.5" />
      <path d="M21.5 35l5.5 6-5.5 6" />
      <circle cx="35.5" cy="41" r="2.5" />
      <circle cx="45" cy="35.5" r="2.5" />
      <circle cx="45" cy="46.5" r="2.5" />
      <path d="M37.8 39.8l4.9-3.1M37.8 42.2l4.9 3.1" />
    </g>

    <g stroke="#25f4ee">
      <path d="M25.5 27.5V20.5a6.25 6.25 0 0 1 12.5 0v7" />
      <path d="M38 20.5V9.5c0 4.6 3.4 7.8 8 8.4" />
      <rect x="11" y="26" width="42" height="30" rx="5.5" />
      <path d="M21.5 35l5.5 6-5.5 6" />
      <circle cx="35.5" cy="41" r="2.5" />
      <circle cx="45" cy="35.5" r="2.5" />
      <circle cx="45" cy="46.5" r="2.5" />
      <path d="M37.8 39.8l4.9-3.1M37.8 42.2l4.9 3.1" />
    </g>
  </g>
</svg>
